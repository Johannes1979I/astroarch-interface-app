name: CI

# La app non aveva CI: ogni contributo esterno andava creduto sulla parola,
# e un PR che non compila si scopriva solo montando Flutter a mano. Qui non
# si costruisce nessun APK: le release sono firmate con la chiave di debug
# della macchina che le compila, quindi un APK costruito su un runner avrebbe
# firma diversa e non si installerebbe sopra quello gia' sul telefono degli
# utenti. Questo workflow verifica e basta.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      # --no-fatal-infos: la repo ha ~90 rilievi informativi preesistenti
      # (curly_braces, prefer_final_fields, deprecated_member_use di Flutter
      # 3.32...). Farli fallire subito significherebbe o una CI rossa per
      # sempre o una riscrittura di massa in mezzo ai contributi altrui.
      # Warning ed errori restano bloccanti, che e' cio' che serve davvero.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # `flutter test` esce con errore se la cartella non esiste, e oggi la
      # repo non ha ancora test: il primo arriva con il PR della web UI.
      - name: flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "nessuna cartella test/ - saltato"
          fi

      # Compilare per web e' il controllo piu' economico che copre anche i
      # target diversi da Android senza toccare nessuna firma.
      - name: flutter build web
        run: flutter build web --release --no-web-resources-cdn
