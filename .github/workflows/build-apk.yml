name: Build APK

# Costruisce l'APK di release e lo allega come artifact (e alla release, se
# il tag esiste). Si lancia a mano o pubblicando un tag.
#
# ⚠️ FIRMA: android/app/build.gradle firma le release con la chiave di
# DEBUG. Android genera quella chiave per macchina, quindi un APK costruito
# qui era firmato con la chiave di DEBUG, che Gradle genera nuova su ogni
# runner effimero: ogni build aveva una firma diversa e Android rifiutava di
# installarla sopra la precedente. Da settembre 2026 il job firma con un
# keystore di release stabile, tenuto nei segreti della repo, quindi gli
# aggiornamenti si installano sopra normalmente.
#
# ⚠️ Il passaggio dalla firma di debug a questa ha richiesto UNA disinstallazione
# finale. Da li' in poi, nessuna piu'.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Versione fissata, non "stable": il wrapper Gradle di questo progetto e'
      # 8.12 e il Flutter stable di oggi ne pretende 8.14. Fissarla riproduce
      # l'ambiente con cui sono state costruite le release precedenti, invece
      # di trascinarsi dietro un aggiornamento di Gradle non richiesto.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Il keystore di release arriva da un segreto e vive solo per la durata
      # del job, fuori dalla cartella del repo. Se il segreto manca (fork, o
      # repo appena clonata) il passo non scrive niente e Gradle ricade sulla
      # chiave di debug: la build riesce comunque, semplicemente non e'
      # installabile sopra le release ufficiali.
      - name: Restore the release keystore
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 assente: firmo con la chiave di debug"
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename with the app version
        id: name
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          NAME="astroarch-interface-v${V}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$NAME"

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Fingerprint of the signing certificate
        run: |
          # Serve a sapere se questo APK e' installabile sopra il precedente:
          # firme diverse => Android rifiuta l'aggiornamento.
          unzip -o -q "${{ steps.name.outputs.apk }}" 'META-INF/*' -d /tmp/sig || true
          keytool -printcert -jarfile "${{ steps.name.outputs.apk }}" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          retention-days: 14
