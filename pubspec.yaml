name: astroarch_interface
description: "Astroarch Interface - Remote observatory control. Zarletti-Osservatorio Jupiter."
publish_to: 'none'
version: 0.2.57+70

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/fonts/13misa/   # font + file di licenza (clausola III Unrender)
    - assets/fonts/exo2/      # font + licenza OFL
    - assets/fonts/antonio/   # font + licenza OFL
  fonts:
    - family: Misa13
      fonts:
        - asset: assets/fonts/13misa/13_Misa.ttf
    # Bundled instead of downloaded from fonts.gstatic.com: in the field
    # there is no connection, and the themes lost their typeface.
    - family: Exo2
      fonts:
        - asset: assets/fonts/exo2/Exo2.ttf
    - family: Antonio
      fonts:
        - asset: assets/fonts/antonio/Antonio.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "assets/app_icon_background.png"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
